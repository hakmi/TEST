                theme: "Sécurité & Incidents", type: "Simulation Pratique",
                question: "Un collègue s'électrocute sur une cellule moyenne tension. 1ère action absolue (CDP) ?",

        ];

        let appState = {
            mode: 'declaratif',
            candidateId: "",
            nom: "",
            prenom: "",
            wilaya: "",
            currentQuestion: 0,
            answers: [],
            score: 0,
            testQuestions: [], // Stockera les questions sélectionnées aléatoirement

        };

        window.allCandidatesResults = window.allCandidatesResults || [];
        const appContainer = document.getElementById('app-container');

        // Mélangeur de tableau (Fisher-Yates shuffle)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function renderIntro() {
            const randomId = "CAND-" + Math.floor(10000 + Math.random() * 90000);
            
            let wilayaOptions = '<option value="">-- Sélectionnez votre wilaya --</option>';
            wilayas.forEach(w => { wilayaOptions += `<option value="${w}">${w}</option>`; });

            appContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden fade-in border border-slate-200">
                    <div class="bg-slate-800 p-8 sm:p-10 text-white text-center relative border-b-4 border-sonelgaz-blue">

                        <h2 class="text-3xl font-bold font-arabic mb-1">منصة التقييم المهني</h2>

                        <!-- Paramétrage du Test -->

        function switchMode(mode) {
            appState.mode = mode;
            renderIntro();
        }

        function startExam() {
            if (appState.mode === 'declaratif') {
                const nom = document.getElementById('input-nom').value.trim();
                const prenom = document.getElementById('input-prenom').value.trim();
                const wilaya = document.getElementById('input-wilaya').value;
                if (!nom || !prenom || !wilaya) { document.getElementById('start-error').classList.remove('hidden'); return; }
                appState.nom = nom.toUpperCase();
                appState.prenom = prenom.charAt(0).toUpperCase() + prenom.slice(1);
                appState.wilaya = wilaya;
                appState.candidateId = `${nom.substring(0,3).toUpperCase()}-${Math.floor(100+Math.random()*900)}`;
            } else {
                appState.candidateId = document.getElementById('input-id').innerText;
                appState.nom = "ANONYME";
                appState.prenom = "";
                appState.wilaya = "Non spécifiée";
            }

            // Génération de l'examen aléatoire
            const nbReq = document.getElementById('input-num-questions').value;
            let poolCopy = JSON.parse(JSON.stringify(questionPool)); // Deep copy
            poolCopy = shuffleArray(poolCopy); // Mélanger la banque de questions
            
            if (nbReq !== 'all') {
                appState.testQuestions = poolCopy.slice(0, parseInt(nbReq));
            } else {
                appState.testQuestions = poolCopy;
            }

            appState.currentQuestion = 0;
            appState.answers = [];
            appState.score = 0;
            
            renderQuestion();
        }

        function renderQuestion() {

            const progress = ((appState.currentQuestion) / appState.testQuestions.length) * 100;
            
            const typeIcon = q.type === "Épreuve Écrite" ? "fa-pen-to-square text-sonelgaz-blue" : "fa-triangle-exclamation text-sonelgaz-orange";
            const typeBg = q.type === "Épreuve Écrite" ? "bg-blue-50 text-sonelgaz-blue border-blue-200" : "bg-orange-50 text-sonelgaz-orange border-orange-200";

            let optionsHtml = '';
            // On ne mélange pas les options pour conserver la logique si "Toutes ces réponses" est présent, 
            // mais on pourrait le faire en mémorisant le nouvel index correct. Pour la fiabilité, on garde l'ordre original des options ici.
            q.options.forEach((opt, index) => {
                optionsHtml += `
                    <div class="relative mb-3 fade-in" style="animation-delay: ${index * 0.1}s">

                            <span class="text-slate-700 font-medium text-sm md:text-base leading-relaxed">${opt}</span>
                        </label>
                    </div>
                `;
            });

            appContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl overflow-hidden fade-in border border-slate-200 flex flex-col h-[85vh] sm:h-auto max-h-[850px]">
                    <div class="p-5 border-b border-slate-100 shrink-0 bg-slate-50">

                            </div>
                            <span class="text-sm font-bold text-slate-700 bg-white px-4 py-1.5 rounded-full shadow-sm border border-slate-200">

                        </button>

            `;

        function enableNextBtn() { document.getElementById('next-btn').disabled = false; }

        function submitAnswer() {
            const selectedOpt = document.querySelector('input[name="q-option"]:checked');
            if (!selectedOpt) return;

            const selectedIndex = parseInt(selectedOpt.value);
            const isCorrect = selectedIndex === appState.testQuestions[appState.currentQuestion].correctIndex;

            appState.answers.push({
                questionIndex: appState.currentQuestion,
                selected: selectedIndex,
                isCorrect: isCorrect
            });

            if (isCorrect) appState.score++;

            appState.currentQuestion++;
            if (appState.currentQuestion < appState.testQuestions.length) {
                renderQuestion();
            } else {
                saveResultAndRender();
            }
        }

        function saveResultAndRender() {
            const percentage = Math.round((appState.score / appState.testQuestions.length) * 100);
            
            const resultData = {
                id: appState.candidateId, nom: appState.nom, prenom: appState.prenom,
                wilaya: appState.wilaya, mode: appState.mode,
                score: appState.score, total: appState.testQuestions.length,
                percentage: percentage, date: new Date().toLocaleString('fr-FR'),
                answers: JSON.parse(JSON.stringify(appState.answers)),
                testSnapshot: JSON.parse(JSON.stringify(appState.testQuestions)) // Garde la trace du test exact généré
            };
            window.allCandidatesResults.push(resultData);
            
            renderResults();
        }

        function renderResults() {
            const totalQ = appState.testQuestions.length;
            const percentage = Math.round((appState.score / totalQ) * 100);
            
            let statusClass, statusText, statusIcon;
            if (percentage >= 80) {
                statusClass = "text-green-700 bg-green-50 border-green-500"; statusText = "Avis Favorable : Maîtrise requise atteinte."; statusIcon = "fa-check-double";
            } else if (percentage >= 60) {
                statusClass = "text-sonelgaz-orange bg-orange-50 border-sonelgaz-orange"; statusText = "Avis Réservé : Connaissances perfectibles."; statusIcon = "fa-triangle-exclamation";
            } else {
                statusClass = "text-red-700 bg-red-50 border-red-500"; statusText = "Avis Défavorable : Lacunes critiques détectées."; statusIcon = "fa-skull-crossbones";
            }

            let correctionsHtml = '';
            appState.answers.forEach((ans, idx) => {
                const q = appState.testQuestions[ans.questionIndex];
                const isCorrect = ans.isCorrect;
                
                const cardBorder = isCorrect ? "border-green-200" : "border-red-200";

                correctionsHtml += `

                                <div class="text-sm mb-4 space-y-2 p-4 rounded-lg bg-slate-50 border border-slate-100">
                                    <p class="${isCorrect ? 'hidden' : 'text-red-600 font-medium'} flex items-start gap-2">
                                        <i class="fas fa-times-circle mt-1"></i> <span><strong>Erreur :</strong> ${q.options[ans.selected]}</span>
                                    </p>
                                    <p class="text-green-700 font-medium flex items-start gap-2">
                                        <i class="fas fa-check-circle mt-1"></i> <span><strong>Attendu :</strong> ${q.options[q.correctIndex]}</span>
                                    </p>
                                </div>

                                    <h5 class="font-bold flex items-center gap-2 mb-1 text-sonelgaz-blue"><i class="fas fa-book-open"></i> Référence CGE</h5>

                    <div class="bg-slate-900 p-8 text-white text-center relative border-b-4 border-sonelgaz-orange">
                        <button onclick="renderIntro()" class="absolute top-4 left-4 text-slate-400 hover:text-white transition bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 hover:border-slate-500">
                            <i class="fas fa-home"></i> NOUVEAU TEST
                        </button>
                        <i class="fas fa-clipboard-check text-5xl mb-4 text-sonelgaz-blue drop-shadow-lg"></i>
                        <h2 class="text-2xl font-bold font-arabic mb-1">تقرير التقييم</h2>
                        <h2 class="text-xl font-bold">Rapport Pédagogique d'Évaluation</h2>

                    <div class="p-6 md:p-8 bg-slate-50">

                                <div class="text-6xl font-black text-slate-800">${appState.score} <span class="text-3xl text-slate-300 font-normal">/ ${totalQ}</span></div>
                            </div>
                            <div class="flex-grow w-full">
                                <div class="flex justify-between mb-2 text-sm font-bold">

                                    <span class="text-xl ${percentage >= 80 ? 'text-green-600' : (percentage >= 60 ? 'text-sonelgaz-orange' : 'text-red-600')}">${percentage}%</span>

                        <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3"><i class="fas fa-microscope text-sonelgaz-blue text-2xl"></i> Correction Détaillée</h3>

        function renderAdminDashboard() {
            let tableRows = window.allCandidatesResults.length === 0 ? `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium">Aucun test passé.</td></tr>` : '';

        function viewCandidateDetails(index) {
            const cand = window.allCandidatesResults[index];
            let errorsHtml = ''; let themesFailed = new Set();
            cand.answers.forEach(ans => {
                if (!ans.isCorrect) {
                    const q = cand.testSnapshot[ans.questionIndex]; // On lit depuis le snapshot du candidat
                    themesFailed.add(q.theme);
                    errorsHtml += `
                        <div class="mb-3 p-4 bg-red-50 border border-red-100 rounded-lg">
                            <p class="text-sm font-bold text-slate-800 mb-2">${q.question}</p>
                            <p class="text-xs text-red-600 mb-1"><i class="fas fa-times mr-1"></i> Réponse : ${q.options[ans.selected]}</p>
                            <p class="text-xs text-green-700 font-semibold"><i class="fas fa-check mr-1"></i> Requise : ${q.options[q.correctIndex]}</p>
                        </div>
                    `;
                }
            });
            if (errorsHtml === '') errorsHtml = `<div class="p-4 bg-green-50 text-green-700 rounded-lg text-center font-bold border border-green-200">Sans faute !</div>`;

            appContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden fade-in border border-slate-200 h-[85vh] flex flex-col">
                    <div class="bg-slate-100 p-4 border-b flex justify-between shrink-0">
                        <button onclick="renderAdminDashboard()" class="text-slate-500 font-bold text-sm bg-white px-4 py-2 rounded-lg border shadow-sm"><i class="fas fa-arrow-left"></i> Retour</button>
                        <span class="font-mono text-xs text-slate-400">Rapport ${cand.id}</span>
                    </div>
                    <div class="p-6 flex-grow overflow-y-auto bg-slate-50">
                        <div class="bg-white p-6 rounded-xl border shadow-sm mb-6 flex justify-between items-center">
                            <div><h3 class="text-2xl font-bold">${cand.nom} ${cand.prenom}</h3><p>${cand.wilaya}</p></div>
                            <div class="text-4xl font-black ${cand.percentage >= 80 ? 'text-green-600' : 'text-red-600'}">${cand.percentage}%</div>
                        </div>
                        <h3 class="text-lg font-bold mb-4">Erreurs commises :</h3>
                        ${errorsHtml}
                    </div>
                </div>
            `;
        }

        function clearResults() {
            window.allCandidatesResults = [];
            renderAdminDashboard();
        }

        renderIntro();
    </script>
</body>
</html>
